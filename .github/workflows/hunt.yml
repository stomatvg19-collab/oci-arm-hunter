name: hunt

# Безкоштовні ARM-машини Oracle роздає з решток потужностей: у популярних
# регіонах вони розлітаються за секунди, тому "Out of host capacity" на першій
# спробі — норма. Єдиний робочий підхід — пробувати регулярно й довго.
#
# Чому GitHub Actions, а не цикл на власному комп'ютері: ноутбук вимикають,
# а слот може звільнитись о третій ночі.

on:
  schedule:
    # ⚠️ Розклад GitHub — best-effort: часті інтервали він відкладає або пропускає
    # під навантаженням. Реально виміряно: cron '*/5' не спрацював жодного разу
    # за 23 хвилини. Тому покладатись на частоту запусків не можна.
    #
    # Рішення: один запуск живе майже 6 годин (стеля GitHub) і всі ці години сам
    # крутить спроби. Розклад лишається тільки сторожем — розбудити наступний
    # запуск, коли попередній добіг чи впав.
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Тримає рівно один активний запуск. Другий стає в чергу й підхопить естафету
# одразу, щойно попередній завершиться — так покриття лишається безперервним.
# Без цього два паралельні запуски створили б дві машини й вичерпали квоту.
concurrency:
  group: hunt
  cancel-in-progress: false

permissions:
  issues: write    # щоб повідомити про успіх (GitHub сам надішле лист)
  actions: write   # щоб вимкнути себе, коли машину вже спіймано

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 6 годин — стеля GitHub для одного завдання

    steps:
      - name: Встановити OCI CLI
        run: pip install --quiet oci-cli

      - name: Налаштувати доступ
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_KEY }}" > ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=ca-toronto-1
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config ~/.oci/key.pem

      - name: Полювання
        id: hunt
        env:
          T: ${{ secrets.OCI_TENANCY }}
          SUBNET: ${{ vars.SUBNET_ID }}
          IMAGE: ${{ vars.IMAGE_ID }}
          AD: ${{ vars.AVAILABILITY_DOMAIN }}
          PUBKEY: ${{ vars.SSH_PUBKEY }}
        run: |
          set +e
          echo "$PUBKEY" > /tmp/id.pub

          # Якщо машина вже є — виходимо миттєво. Саме завдяки цій перевірці
          # заплановані запуски після успіху коштують секунди, а не хвилини.
          existing=$(oci compute instance list -c "$T" --lifecycle-state RUNNING \
              --query 'data[?"display-name"==`inboost-stand`].id | [0]' --raw-output 2>/dev/null)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              echo "Машина вже працює: $existing"
              echo "found=already" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # Oracle роздає потужності шматками: втиснути 2 ядра / 12 ГБ у залишки
          # набагато простіше, ніж знайти суцільний блок під 4 / 24. Тому в кожному
          # циклі пробуємо обидва розміри — спершу бажаний, потім запасний.
          #
          # Взяти менше не пастка: безкоштовний ліміт (4 ядра / 24 ГБ) можна
          # витратити як завгодно, а машину потім дозволено збільшити — зупинити,
          # змінити конфігурацію, запустити.
          SIZES='4:24 2:12'

          deadline=$(( $(date +%s) + 20400 ))   # 5 год 40 хв, із запасом до таймауту
          n=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
              for size in $SIZES; do
                  cpu=${size%%:*}
                  ram=${size##*:}
                  n=$((n+1))

                  out=$(oci compute instance launch \
                      -c "$T" \
                      --availability-domain "$AD" \
                      --shape VM.Standard.A1.Flex \
                      --shape-config "{\"ocpus\":$cpu,\"memoryInGBs\":$ram}" \
                      --image-id "$IMAGE" \
                      --subnet-id "$SUBNET" \
                      --display-name inboost-stand \
                      --assign-public-ip true \
                      --boot-volume-size-in-gbs 100 \
                      --ssh-authorized-keys-file /tmp/id.pub \
                      --query 'data.id' --raw-output 2>&1)

                  if echo "$out" | grep -q '^ocid1.instance'; then
                      id=$(echo "$out" | grep -o '^ocid1.instance[^ ]*' | head -1)
                      echo "✅ Спіймали зі спроби №$n: $cpu ядра / $ram ГБ — $id"
                      echo "found=new" >> "$GITHUB_OUTPUT"
                      echo "instance=$id" >> "$GITHUB_OUTPUT"
                      echo "size=$cpu ядра / $ram ГБ" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "спроба $n ($cpu/$ram) — $(echo "$out" | grep -o '"message": "[^"]*"' | head -1)"
              done
              sleep 20
          done
          echo "found=no" >> "$GITHUB_OUTPUT"

      - name: Дізнатись публічний IP
        if: steps.hunt.outputs.found == 'new'
        id: ip
        run: |
          sleep 45
          ip=$(oci compute instance list-vnics --instance-id "${{ steps.hunt.outputs.instance }}" \
               --query 'data[0]."public-ip"' --raw-output)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Повідомити про успіх і вимкнути полювання
        if: steps.hunt.outputs.found == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "✅ ARM-машина спіймана" --body "$(cat <<EOF
          Oracle нарешті дав вільний слот.

          - **Конфігурація:** ${{ steps.hunt.outputs.size }}
          - **Instance:** \`${{ steps.hunt.outputs.instance }}\`
          - **Публічний IP:** \`${{ steps.ip.outputs.ip }}\`
          - **Підключення:** \`ssh -i ~/.ssh/oracle_inboost ubuntu@${{ steps.ip.outputs.ip }}\`

          Полювання вимкнено — більше запусків не буде.
          EOF
          )"
          gh workflow disable hunt.yml
